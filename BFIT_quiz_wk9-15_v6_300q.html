  <!DOCTYPE html>
  <html lang="th">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>แบบทดสอบ BFIT สัปดาห์ 9–15</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #fff;
        --tx: #1b1f2a;
        --mu: #5d6577;
        --bd: #dfe3ec;
        --pr: #3b5bdb;
        --prs: #e8edff;
        --ok: #1e8e4f;
        --oks: #e3f6ea;
        --no: #c92a2a;
        --nos: #fde8e8;
        --wa: #fff4d6;
        --wat: #7a5600;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px)
      }

      @media (prefers-color-scheme:dark) {
        :root:not([data-theme="light"]) {
          --bg: #13151b;
          --card: #1c1f28;
          --tx: #eceef4;
          --mu: #9aa2b5;
          --bd: #2d3240;
          --pr: #8ea2ff;
          --prs: #252b45;
          --ok: #5fd18a;
          --oks: #173324;
          --no: #ff8787;
          --nos: #3a1c1e;
          --wa: #3a3015;
          --wat: #ffd978
        }
      }

      :root[data-theme="dark"] {
        --bg: #13151b;
        --card: #1c1f28;
        --tx: #eceef4;
        --mu: #9aa2b5;
        --bd: #2d3240;
        --pr: #8ea2ff;
        --prs: #252b45;
        --ok: #5fd18a;
        --oks: #173324;
        --no: #ff8787;
        --nos: #3a1c1e;
        --wa: #3a3015;
        --wat: #ffd978
      }

      * {
        box-sizing: border-box
      }

      html,
      body {
        margin: 0
      }

      body {
        background: var(--bg);
        color: var(--tx);
        font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
        line-height: 1.7;
        font-size: 16px
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px
      }

      h1 {
        font-size: 1.15rem;
        margin: 4px 0 2px
      }

      .sub {
        color: var(--mu);
        font-size: .85rem;
        margin: 0 0 14px
      }

      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 14px
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: .9rem;
        margin-bottom: 8px
      }

      .badge {
        background: var(--prs);
        color: var(--pr);
        padding: 2px 12px;
        border-radius: 99px;
        font-weight: 500
      }

      .bar {
        height: 8px;
        background: var(--bd);
        border-radius: 9px;
        overflow: hidden;
        margin-bottom: 14px
      }

      .bar i {
        display: block;
        height: 100%;
        background: var(--pr);
        transition: width .25s
      }

      .qn {
        color: var(--mu);
        font-size: .85rem
      }

      .qt {
        font-size: 1.05rem;
        font-weight: 500;
        margin: 4px 0 14px
      }

      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1.5px solid var(--bd);
        border-radius: 12px;
        padding: 11px 13px;
        margin-bottom: 9px;
        cursor: pointer
      }

      .opt:hover {
        border-color: var(--pr)
      }

      .opt.sel {
        border-color: var(--pr);
        background: var(--prs)
      }

      .opt b {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1.5px solid var(--bd);
        display: grid;
        place-items: center;
        font-size: .85rem
      }

      .opt.sel b {
        background: var(--pr);
        border-color: var(--pr);
        color: var(--card)
      }

      .opt:disabled {
        color: var(--tx);
        opacity: 1;
        cursor: default
      }

      .opt:disabled:hover {
        border-color: var(--bd)
      }

      .opt.ok,
      .opt.ok:disabled:hover {
        border-color: var(--ok);
        background: var(--oks)
      }

      .opt.bad,
      .opt.bad:disabled:hover {
        border-color: var(--no);
        background: var(--nos)
      }

      .opt.ok b {
        background: var(--ok);
        border-color: var(--ok);
        color: var(--card)
      }

      .opt.bad b {
        background: var(--no);
        border-color: var(--no);
        color: var(--card)
      }

      .fb {
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        background: var(--bg);
        border-left: 5px solid var(--bd)
      }

      .fb.ok {
        border-left-color: var(--ok)
      }

      .fb.bad {
        border-left-color: var(--no)
      }

      .fb .rs {
        background: none;
        padding: 0;
        color: var(--tx)
      }

      .ref {
        font-size: .85rem;
        color: var(--pr);
        margin-top: 6px
      }

      .tf {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px
      }

      .tf .opt {
        justify-content: center;
        align-items: center;
        font-size: 1.1rem;
        font-weight: 700;
        padding: 16px;
        margin: 0
      }

      .nav {
        display: flex;
        gap: 10px;
        justify-content: space-between
      }

      .btn {
        font: inherit;
        font-weight: 500;
        border: 0;
        border-radius: 12px;
        padding: 11px 20px;
        cursor: pointer;
        background: var(--pr);
        color: var(--card)
      }

      .btn.g {
        background: var(--card);
        color: var(--tx);
        border: 1.5px solid var(--bd)
      }

      .btn:disabled {
        opacity: .4;
        cursor: default
      }

      .warn {
        background: var(--wa);
        color: var(--wat);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 12px;
        font-size: .92rem
      }

      .warn .btn {
        margin: 8px 8px 0 0;
        padding: 7px 14px
      }

      details {
        margin-top: 12px;
        font-size: .9rem
      }

      summary {
        cursor: pointer;
        color: var(--mu)
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
        gap: 6px;
        margin-top: 10px
      }

      .grid button {
        font: inherit;
        font-size: .8rem;
        padding: 5px 0;
        border-radius: 8px;
        border: 1.5px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        cursor: pointer
      }

      .grid .an {
        background: var(--prs);
        border-color: var(--pr)
      }

      .grid .cu {
        outline: 2px solid var(--pr)
      }

      .score {
        text-align: center
      }

      .big {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--pr)
      }

      .parts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px
      }

      .parts div {
        background: var(--prs);
        border-radius: 12px;
        padding: 10px
      }

      .parts b {
        display: block;
        font-size: 1.3rem
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 4px 0 12px
      }

      .tabs .btn {
        padding: 7px 14px;
        font-size: .9rem
      }

      .rv {
        border-left: 5px solid var(--bd)
      }

      .rv.ok {
        border-left-color: var(--ok)
      }

      .rv.bad {
        border-left-color: var(--no)
      }

      .tag {
        display: inline-block;
        font-size: .8rem;
        font-weight: 700;
        padding: 1px 10px;
        border-radius: 99px;
        margin-right: 6px
      }

      .tag.ok {
        background: var(--oks);
        color: var(--ok)
      }

      .tag.bad {
        background: var(--nos);
        color: var(--no)
      }

      .ln {
        font-size: .92rem;
        margin: 3px 0
      }

      .rs {
        font-size: .88rem;
        color: var(--mu);
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        margin-top: 8px
      }

      .rm h2 {
        font-size: 1.02rem;
        margin: 0 0 8px
      }

      .rm ul {
        margin: 6px 0 0;
        padding-left: 20px
      }

      .rm li {
        margin: 5px 0;
        font-size: .93rem
      }

      .rm table {
        width: 100%;
        border-collapse: collapse;
        font-size: .88rem;
        margin: 8px 0
      }

      .rm th,
      .rm td {
        border: 1px solid var(--bd);
        padding: 5px 7px;
        text-align: center
      }

      .rm th {
        background: var(--prs)
      }

      .rm tr.tot td {
        font-weight: 700
      }

      .rm tr.todo td {
        color: var(--wat);
        background: var(--wa)
      }

      .row {
        margin-bottom: 9px
      }

      .row .opt {
        margin-bottom: 5px
      }

      .chip {
        font: inherit;
        font-size: .82rem;
        border: 1.5px solid var(--pr);
        color: var(--pr);
        background: var(--card);
        border-radius: 99px;
        padding: 3px 12px;
        margin: 0 6px 4px 0;
        cursor: pointer
      }

      .mu {
        color: var(--mu)
      }

      .qhd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px
      }

      .flagb {
        font: inherit;
        font-size: .82rem;
        border: 1.5px solid var(--bd);
        background: var(--card);
        color: var(--mu);
        border-radius: 99px;
        padding: 2px 11px;
        cursor: pointer
      }

      .flagb.on {
        border-color: var(--no);
        color: var(--no);
        background: var(--nos)
      }

      .hint {
        font-size: .85rem;
        color: var(--mu);
        margin: -6px 0 10px
      }

      .opt.multi b {
        border-radius: 7px
      }

      .grid .fl {
        box-shadow: inset 0 -3px 0 var(--no)
      }

      .parts {
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr))
      }
    </style>
  </head>

  <body>
    <div class="wrap" id="app"></div>
    <script>
      const ALL = [{ "n": 1, "t": "tf", "q": "Taylor (1911) เชื่อว่าเงินเป็นแรงจูงใจเพียงอย่างเดียวของพนักงาน และในระบบจ่ายตามชิ้นงาน (Price-rate system) พนักงานที่ผลิตเกินโควตาจะได้อัตราค่าจ้างต่อชิ้นที่สูงขึ้นสำหรับชิ้นงานทั้งหมดที่ผลิตได้ ไม่ใช่เฉพาะส่วนที่เกินโควตา", "o": [], "a": "ถ", "r": "สไลด์ Taylor ระบุว่าเงินเป็นแรงจูงใจเพียงอย่างเดียว และอัตราที่สูงขึ้นใช้กับชิ้นงานทั้งหมดที่ผลิตได้ (คำว่า \"เพียงอย่างเดียว\" เป็นความเชื่อของ Taylor จึงไม่ใช่ข้อหลอก)", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 9" }, { "n": 2, "t": "tf", "q": "ตามทฤษฎีลำดับขั้นความต้องการของ Maslow ความมั่นคงในงาน (Job security) จัดอยู่ในความต้องการทางกายภาพ (Physiological needs)", "o": [], "a": "ผ", "r": "Job security อยู่ในความต้องการความปลอดภัย (Safety needs)", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 11" }, { "n": 3, "t": "tf", "q": "การศึกษาที่ Hawthorne (Western Electric) สรุปว่าผลผลิตขึ้นอยู่กับปัจจัยทางกายภาพ เช่น แสงสว่างและช่วงเวลาพักเพียงอย่างเดียว ส่วนปัจจัยทางสังคมและจิตวิทยาไม่มีผลต่อผลผลิต", "o": [], "a": "ผ", "r": "Hawthorne พบว่าปัจจัยสังคมและจิตวิทยามีผลต่อผลผลิตและขวัญในการทำงานด้วย", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 10" }, { "n": 4, "t": "tf", "q": "ตามทฤษฎีของ Herzberg เงินเดือนเป็นปัจจัยสุขอนามัย (Hygiene factor) ซึ่งช่วยป้องกันความไม่พึงพอใจในงาน แต่ไม่ได้รับประกันว่าพนักงานจะมีแรงจูงใจสูงขึ้น", "o": [], "a": "ถ", "r": "เงินเดือนเป็นปัจจัยสุขอนามัย ป้องกันความไม่พึงพอใจ แต่ไม่ใช่ปัจจัยจูงใจ", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 13" }, { "n": 5, "t": "tf", "q": "ในโครงสร้างแบบสายงานหลักและสายงานสนับสนุน (Line and staff) สายงานสนับสนุนมีอำนาจตัดสินใจโดยตรง ส่วนสายงานหลักทำหน้าที่ให้คำแนะนำและความช่วยเหลือ", "o": [], "a": "ผ", "r": "สลับกัน สายงานหลักมีอำนาจตัดสินใจโดยตรง สายงานสนับสนุนไม่มีอำนาจตัดสินใจโดยตรง", "w": "12", "f": "สไลด์สัปดาห์ 12 · PDF หน้า 8" }, { "n": 6, "t": "tf", "q": "หากองค์กรลดชั้นการบริหารลงโดยจำนวนพนักงานเท่าเดิม องค์กรจะแบนราบขึ้นและช่วงของการควบคุม (Span of control) ของผู้จัดการจะกว้างขึ้น", "o": [], "a": "ถ", "r": "ลดชั้นการบริหารทำให้แบนราบ และผู้จัดการคุมคนมากขึ้น (ช่วงการควบคุมกว้าง)", "w": "12", "f": "สไลด์สัปดาห์ 12 · PDF หน้า 9" }, { "n": 7, "t": "tf", "q": "การลาออก (Attrition) คือการไล่พนักงานออกจากกำลังคนจนกว่าจะมีการจ้างพนักงานใหม่อีกครั้ง", "o": [], "a": "ผ", "r": "นั่นคือนิยามของการเลิกจ้าง (Layoffs) ส่วน Attrition คือการลดจำนวนตามปกติเมื่อพนักงานออกจากบริษัท", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 32" }, { "n": 8, "t": "tf", "q": "ทฤษฎี X ของ McGregor มองว่าพนักงานยินดีทำงานและต้องการความรับผิดชอบมากขึ้น ผู้บังคับบัญชาจึงควรมอบหมายความรับผิดชอบเพื่อสร้างแรงจูงใจ", "o": [], "a": "ผ", "r": "นั่นคือทฤษฎี Y ส่วนทฤษฎี X มองว่าพนักงานไม่ชอบงานและหลีกเลี่ยงความรับผิดชอบ", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 17" }, { "n": 9, "t": "tf", "q": "คำอธิบายรายละเอียดของงาน (Job description) ระบุทักษะ ความสามารถ วุฒิการศึกษา และประสบการณ์ที่จำเป็นสำหรับตำแหน่งงาน", "o": [], "a": "ผ", "r": "ข้อความนี้คือ Job specification (คุณลักษณะเฉพาะสำหรับงาน)", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 33" }, { "n": 10, "t": "tf", "q": "การจัดแบ่งแผนกตามฟังก์ชันมีข้อจำกัดคือ การแลกเปลี่ยนเรียนรู้กับทีมอื่นมีจำกัด และพนักงานอาจขาดโอกาสสื่อสารกับแผนกอื่น", "o": [], "a": "ถ", "r": "เป็นข้อจำกัดของการแบ่งตามฟังก์ชันตามสไลด์", "w": "12", "f": "สไลด์สัปดาห์ 12 · PDF หน้า 18" }, { "n": 11, "t": "tf", "q": "ทฤษฎี Z ของ Ouchi ผสมผสานแนวทางการจัดการแบบอเมริกัน (Type A) กับแบบญี่ปุ่น (Type J) โดยเชื่อว่าพนักงานมีแรงจูงใจเมื่อได้มีส่วนร่วมในการตัดสินใจ", "o": [], "a": "ถ", "r": "ตรงกับสไลด์ทฤษฎี Z", "w": "13", "f": "สไลด์สัปดาห์ 13 · PDF หน้า 18" }, { "n": 12, "t": "tf", "q": "ในองค์กรแบบเมทริกซ์ พนักงานจะขึ้นตรงต่อผู้จัดการโครงงานเพียงคนเดียว จึงทำให้สายบังคับบัญชาชัดเจนกว่าโครงสร้างแบบเดิม", "o": [], "a": "ผ", "r": "พนักงานขึ้นตรงกับทั้งผู้จัดการโครงงานและผู้จัดการในสายบังคับบัญชา ทำให้สายบังคับบัญชาไม่ชัดเจน", "w": "12", "f": "สไลด์สัปดาห์ 12 · PDF หน้า 28" }, { "n": 13, "t": "tf", "q": "หากการพยากรณ์พบว่าอุปทาน (Supply) ของทรัพยากรมนุษย์มากกว่าอุปสงค์ (Demand) บริษัทจะต้องจัดทำแผนลดจำนวน         sec('วิธีให้คะแนน', ['ถูก/ผิด และปรนัยตอบเดียว: ข้อละ 1 คะแนน', 'ปรนัยหลายคำตอบ: ได้ 1 คะแนนเมื่อเลือกถูกครบทุกตัวและไม่เลือกตัวที่ผิด ไม่มีคะแนนบางส่วน', 'ข้อที่ไม่ได้ตอบนับเป็นผิด']);
        sec('ข้อจำกัดและจุดที่ไม่แน่ใจ', [
          'สัปดาห์ 9 ไม่มีไฟล์สไลด์ ช่องอ้างอิงของข้อใหม่จึงระบุว่าไม่มีสไลด์ ศัพท์หรือรายการบางอย่างอาจไม่ตรงสไลด์',
          'ข้อ ' + (M.prev + 1) + '–' + M.p3 + ' (สัปดาห์ 12–13) ช่องอ้างอิงระบุหัวข้อแทนเลขหน้า เพราะไม่มีไฟล์สไลด์ในรอบนี้ เนื้อหาอิงความรู้ทั่วไปของหัวข้อนั้น',
          'การลดข้อ 6 ตัวเลือกเหลือ 4 ตัวเลือกทำโดยตัดตัวลวงสองตัว เลือกตัดตามความยาว ไม่ได้ประเมินว่าตัวลวงตัวใดดีกว่า จึงควรอ่านทวนข้อสัปดาห์ 12–13 ที่ถูกลดตัวเลือก',
          'ข้อสัปดาห์ 10 อ้างอิงเลขหน้าของไฟล์ PDF ไม่ใช่เลขสไลด์ที่พิมพ์บนหน้า',
          'ข้อมูลในสไลด์สัปดาห์ 10 ตรวจกับข้อความที่ดึงจากไฟล์ ส่วนรูปภาพและตารางที่เป็นภาพอ่านไม่ได้ทั้งหมด บางข้อที่เป็นนิยามกว้างๆ (เช่น Hostile takeover, Tender offer) เนื้อหาจึงอิงความรู้ทั่วไป',
          'ความยาวตัวเลือกวัดเป็นจำนวนตัวอักษร ไม่ใช่ความกว้างที่แสดงจริง',
          'ข้อสัปดาห์ 11 และ 15 อ่านจากสไลด์ที่แสดงเป็นภาพและข้อความ ข้อสัปดาห์ 14 อ่านจากข้อความในไฟล์ PDF เนื้อหาที่เป็นรูปภาพหรือแผนภาพ (เช่น ตัวอย่างระบบ รายงาน MIS โครงสร้างระบบ) อ่านไม่ได้ครบ จึงไม่ได้ออกข้อจากส่วนนั้น',
          'สไลด์สัปดาห์ 14 มีองค์ประกอบ 6 ส่วนในสไลด์สรุป แต่นิยาม MIS มี 5 ส่วน ข้อใหม่ใช้ทั้งสองจุดตามที่สไลด์ระบุ ควรแยกให้ชัดตอนทบทวน',

        const b = el('button', 'btn', 'เข้าสู่หน้าเลือกชุดข้อสอบ ›'); b.onclick = () => { view = 'home'; render() }; app.append(b)
      }
      /* ---------- หน้าเลือกชุด ---------- */
      function home() {
        const s = sget();
        app.append(el('h1', 0, TITLE), el('p', 'sub', 'เลือกชุดข้อสอบ แล้วเลือกคำตอบเพื่อดูเฉลยทันที · ' + META.version));
        const rb = el('button', 'btn g', '📖 ReadMe'); rb.style.cssText = 'padding:4px 12px;font-size:.85rem;margin-bottom:10px'; rb.onclick = () => { view = 'readme'; render() }; app.append(rb);
        const rows = ['9', '10', '11', '12', '13', '14', '15'].map(w => [w, WK[w]]).concat([['all', 'ทั้งหมด (สัปดาห์ 9–15)'], ['flag', '🚩 ข้อที่ติดธง']]); const _unused = [['all', ''], ['flag', '🚩 ข้อที่ติดธง']];

          b.append(el('b', 0, w === 'all' ? '∑' : w === 'flag' ? '🚩' : w), el('span', 0, l + ' · ' + n + ' ข้อ'));
          if (n === 0) { b.disabled = true; b.append(el('span', 'mu', ' (ยังไม่มี)')) }
          b.onclick = () => begin(w); row.append(b);
          ['full', 'redo'].forEach(m => { const v = s[w + ':' + m]; if (v) { const c = el('button', 'chip', (m === 'redo' ? 'ต่อ "ทำซ้ำข้อผิด"' : 'ต่อจากเดิม') + ' · ตอบแล้ว ' + v.A.filter(x => x != null).length + '/' + v.ids.length + (v.done ? ' · สรุปผลแล้ว' : '')); c.onclick = () => resume(w, m); row.append(c) } });
          app.append(row)
        })
      }
      /* ---------- หน้าทำข้อสอบ ---------- */
      function quiz() {
        const q = Q[i], un = A.filter(a => a == null).length, N = Q.length;
        app.append(el('h1', 0, TITLE), el('p', 'sub', 'ชุด: ' + setName(SEL) + (MODE === 'redo' ? ' (ทำซ้ำเฉพาะข้อที่ผิด)' : '') + ' · เลือกคำตอบแล้วเฉลยทันที พร้อมเหตุผลอ้างอิงสไลด์'));
        const hb = el('button', 'btn g', '‹ เลือกชุดอื่น'); hb.style.cssText = 'padding:4px 12px;font-size:.85rem;margin-bottom:10px'; hb.onclick = () => { save(); SEL = null; render() }; app.append(hb);
        const top = el('div', 'top'); top.append(el('span', 'badge', q.t === 'tf' ? 'ถูก/ผิด' : q.t === 'mm' ? 'เลือกได้หลายคำตอบ · ' + q.o.length + ' ตัวเลือก' : 'ปรนัย · เลือก 1 คำตอบ (' + q.o.length + ' ตัวเลือก)'), el('b', 0, (i + 1) + '/' + N));
        const bar = el('div', 'bar'), f = el('i'); f.style.width = ((i + 1) / N * 100) + '%'; bar.append(f);
        const c = el('div', 'card'), hd = el('div', 'qhd'), fb = el('button', 'flagb' + (FLG[q.n] ? ' on' : ''), FLG[q.n] ? '🚩 ติดธงแล้ว' : '⚐ ติดธง'); fb.onclick = () => { FLG[q.n] = !FLG[q.n]; save(); render(true) };
        hd.append(el('div', 'qn', 'ข้อ ' + q.n), fb); c.append(hd, el('div', 'qt', q.q));
        const ans = A[i] != null;
        if (q.t === 'tf') { const g = el('div', 'tf');[['ถ', 'ถูก'], ['ผ', 'ผิด']].forEach(([v, l]) => { const k = 'opt' + (ans ? (v === q.a ? ' ok' : v === A[i] ? ' bad' : '') : ''), m = ans ? (v === q.a ? '✓' : v === A[i] ? '✗' : '') : ''; const b = el('button', k, l + (m ? ' ' + m : '')); b.disabled = ans; b.onclick = () => { A[i] = v; warn = false; save(); render(true) }; g.append(b) }); c.append(g) }
        else if (q.t === 'mc') q.o.forEach(([l, tx]) => { const k = 'opt' + (ans ? (l === q.a ? ' ok' : l === A[i] ? ' bad' : '') : ''), m = ans ? (l === q.a ? '✓' : l === A[i] ? '✗' : '') : ''; const b = el('button', k); b.append(el('b', 0, m || l), el('span', 0, tx)); b.disabled = ans; b.onclick = () => { A[i] = l; warn = false; save(); render(true) }; c.append(b) });
        else {
          c.append(el('div', 'hint', 'เลือกได้มากกว่า 1 ข้อ แล้วกด "ยืนยันคำตอบ" ต้องถูกครบทุกตัวถึงได้คะแนน'));
          q.o.forEach(([l, tx]) => {
            const on = ans ? A[i].includes(l) : pend.includes(l), cr = q.a.includes(l);
            const k = 'opt multi' + (ans ? (cr ? ' ok' : on ? ' bad' : '') : (on ? ' sel' : '')), m = ans ? (cr ? '✓' : on ? '✗' : l) : (on ? '✓' : l);
            const b = el('button', k); b.append(el('b', 0, m), el('span', 0, tx + (ans && on ? '  (คุณเลือก)' : ''))); b.disabled = ans;
            b.onclick = () => { pend = pend.includes(l) ? pend.filter(x => x !== l) : pend.concat(l); render(true) }; c.append(b)
          });
          if (!ans) { const cf = el('button', 'btn', pend.length ? 'ยืนยันคำตอบ (' + pend.length + ' ตัวเลือก)' : 'ยืนยันคำตอบ'); cf.disabled = !pend.length; cf.onclick = () => { A[i] = 'กขคง'.split('').filter(x => pend.includes(x)).join(''); pend = []; warn = false; save(); render(true) }; c.append(cf) }
        }
        if (ans) {
          const ok = A[i] === q.a, fe = el('div', 'fb ' + (ok ? 'ok' : 'bad')), h = el('div', 'ln'); h.append(el('span', 'tag ' + (ok ? 'ok' : 'bad'), ok ? 'ถูกต้อง' : 'ยังไม่ถูก')); fe.append(h);
          if (!ok) fe.append(el('div', 'ln', 'เฉลย: ' + lab(q, q.a)));
          fe.append(el('div', 'rs', 'เหตุผล: ' + q.r), el('div', 'ref', '📖 อ้างอิง: ' + q.f)); c.append(fe)
        }
        app.append(top, bar, c);
        if (warn) {
          const w = el('div', 'warn', 'ยังไม่ได้ตอบอีก ' + un + ' ข้อ ต้องการส่งเลยหรือไม่?'); w.append(document.createElement('br'));
          const a = el('button', 'btn', 'ส่งเลย'); a.onclick = () => { done = true; save(); render() };
          const b = el('button', 'btn g', 'ไปข้อที่ยังไม่ตอบ'); b.onclick = () => go(A.findIndex(x => x == null)); w.append(a, b); app.append(w)
        }
        const nav = el('div', 'nav');
        const back = el('button', 'btn g', '‹ ย้อนกลับ'); back.disabled = i === 0; back.onclick = () => go(i - 1);
        const nx = el('button', 'btn', i === N - 1 ? 'ส่งคำตอบ' : 'ถัดไป ›');
        nx.onclick = () => { if (i < N - 1) go(i + 1); else if (un > 0 && !warn) { warn = true; render() } else { done = true; save(); render() } };
        nav.append(back, nx); app.append(nav);
        const d = document.createElement('details'), s = el('summary', 0, 'ไปยังข้อ · ตอบแล้ว ' + (N - un) + '/' + N + ' · ติดธง ' + Q.filter(x => FLG[x.n]).length), g = el('div', 'grid');
        Q.forEach((x, k) => { const b = el('button', (A[k] != null ? 'an ' : '') + (k === i ? 'cu ' : '') + (FLG[x.n] ? 'fl' : ''), x.n); b.onclick = () => go(k); g.append(b) });
        d.append(s, g); app.append(d)
      }
      /* ---------- สรุปผล ---------- */
      function result() {
        const N = Q.length, ok = Q.map((q, k) => A[k] === q.a), T = t => Q.filter(q => q.t === t).length, G = t => ok.filter((x, k) => x && Q[k].t === t).length, tot = ok.filter(Boolean).length, nb = N - tot;
        app.append(el('h1', 0, 'สรุปผลการทดสอบ · ' + setName(SEL) + (MODE === 'redo' ? ' (ทำซ้ำข้อที่ผิด)' : '')));
        const s = el('div', 'card score'); s.append(el('div', 'sub', 'คะแนนรวม'), el('div', 'big', tot + '/' + N), el('div', 'sub', Math.round(tot / N * 100) + '%'));
        const p = el('div', 'parts');[['ถูก/ผิด', 'tf'], ['ปรนัยตอบเดียว', 'mc'], ['หลายคำตอบ', 'mm']].forEach(([l, t]) => { if (!T(t)) return; const d = el('div'); d.append(el('span', 0, l), el('b', 0, G(t) + '/' + T(t))); p.append(d) }); s.append(p); app.append(s);
        const fl = Q.filter(q => FLG[q.n]).length, t = el('div', 'tabs');
        [['bad', 'เฉพาะข้อที่ผิด (' + nb + ')'], ['flag', '🚩 ติดธง (' + fl + ')'], ['all', 'ทั้งหมด (' + N + ')']].forEach(([k, l]) => { const x = el('button', 'btn' + (flt === k ? '' : ' g'), l); x.onclick = () => { flt = k; render() }; t.append(x) }); app.append(t);
        let shown = 0;
        Q.forEach((q, k) => {
          if (flt === 'bad' && ok[k]) return; if (flt === 'flag' && !FLG[q.n]) return; shown++;
          const c = el('div', 'card rv ' + (ok[k] ? 'ok' : 'bad')), h = el('div', 'ln'); h.append(el('span', 'tag ' + (ok[k] ? 'ok' : 'bad'), ok[k] ? 'ถูก' : (A[k] == null ? 'ไม่ได้ตอบ' : 'ผิด')), el('b', 0, 'ข้อ ' + q.n));
          const fb = el('button', 'flagb' + (FLG[q.n] ? ' on' : ''), FLG[q.n] ? '🚩' : '⚐'); fb.style.marginLeft = '8px'; fb.onclick = () => { FLG[q.n] = !FLG[q.n]; save(); render(true) }; h.append(fb);
          c.append(h, el('div', 'qt', q.q));
          if (!ok[k]) c.append(el('div', 'ln', 'คำตอบของคุณ: ' + lab(q, A[k])));
          c.append(el('div', 'ln', 'เฉลย: ' + lab(q, q.a)), el('div', 'rs', 'เหตุผล: ' + q.r), el('div', 'ref', '📖 อ้างอิง: ' + q.f)); app.append(c)
        });
        if (!shown) app.append(el('div', 'card', flt === 'flag' ? 'ยังไม่มีข้อที่ติดธงในชุดนี้' : 'ยอดเยี่ยม! ตอบถูกทุกข้อ 🎉'));
        const r = el('button', 'btn', 'ทำใหม่ทั้งชุด'); r.onclick = () => { reset(); save(); render() };
        const rw = el('button', 'btn', 'ทำซ้ำเฉพาะข้อที่ผิด (' + nb + ')'); rw.disabled = !nb; rw.onclick = () => begin(SEL, 'redo', Q.filter((q, k) => !ok[k]));
        const h2 = el('button', 'btn g', 'เลือกชุดอื่น'); h2.onclick = () => { SEL = null; render() };
        const bx = el('div', 'nav'); bx.style.cssText = 'flex-wrap:wrap;justify-content:flex-start'; bx.append(r, rw, h2); app.append(bx)
      }
      loadFlags(); render();
    </script>
